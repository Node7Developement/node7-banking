$engine: 3
$onesync: on
name: NODE7 Banking
version: 2.4.0
author: NODE7 Development Studios
description: Multi-currency personal, society, gang, and shared banking powered by node7-ui and node7-cashitem.
tasks:
  - action: connect_database
  - action: query_database
    file: node7-banking.sql
  - action: write_file
    file: ./node7-banking.cfg
    data: |
      ensure node7-core
      ensure node7-cashitem
      ensure node7-ui
      ensure node7-banking
